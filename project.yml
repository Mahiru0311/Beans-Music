name: Beans

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    sources: [Beans]
    resources:
      - Beans/en.lproj
      - Beans/zh-Hans.lproj
    dependencies:
      - target: CoLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.coco
        MARKETING_VERSION: "1.9.1"
        CURRENT_PROJECT_VERSION: "39"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Co
        CFBundleName: Co
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  CoLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - CoLiveActivity
      - Beans/CocoNowPlayingAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.coco.liveactivity
        MARKETING_VERSION: "1.9.1"
        CURRENT_PROJECT_VERSION: "39"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: CoLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Co Now Playing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
