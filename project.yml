name: Beans

options:
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - Beans
      - BeansLiveActivityShared
    resources:
      - Beans/en.lproj
      - Beans/zh-Hans.lproj
      - Beans/Resources/SimpleIcons-LICENSE.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.coco
        DEAD_CODE_STRIPPING: YES
        DEPLOYMENT_POSTPROCESSING: YES
        STRIP_INSTALLED_PRODUCT: YES
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Beans/Beans.entitlements
    dependencies:
      - target: BeansLiveActivity
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Co
        CFBundleName: Co
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        UISupportsCarPlay: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  BeansLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - BeansLiveActivity
      - BeansLiveActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.coco.liveactivity
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: "15"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BeansLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Co Now Playing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BeansTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - BeansTests
    dependencies:
      - target: Beans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.coco.tests
schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - BeansTests

